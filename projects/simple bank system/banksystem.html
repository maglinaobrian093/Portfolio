<!DOCTYPE html>
<html>
<head>
  <title>Bank Hub</title>
  <style>
    body {
      background-color: #121212;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 60px;
    }

    h2 {
      color: #ffa31a;
    }

    input {
      width: 200px;
      padding: 10px;
      border: none;
      border-radius: 5px;
      text-align: center;
      margin-bottom: 10px;
    }

    button {
      background-color: #ffa31a;
      color: black;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px;
      font-weight: bold;
      transition: 0.2s;
    }

    button:hover {
      background-color: #ffbf40;
    }

    #output {
      margin-top: 20px;
      background-color: #1e1e1e;
      padding: 15px;
      border-radius: 10px;
      width: 300px;
      margin-left: auto;
      margin-right: auto;
      font-weight: bold;
      color: #ffa31a;
    }
  </style>
</head>
<body>

  <h2>Bank Hub</h2>

  <input type="number" id="amount" placeholder="Enter amount"><br>

  <button onclick="deposit()">Deposit</button>
  <button onclick="withdraw()">Withdraw</button>
  <button onclick="checkBalance()">Check Balance</button>
  <button onclick="clearSystem()">Clear / Exit</button>

  <div id="output">Welcome! Your balance is ₱0.</div>

  <script>
    var balance = 0;

    function deposit() {
      var amount = parseFloat(document.getElementById("amount").value);
      if (amount > 0) {
        balance += amount;
        document.getElementById("output").innerText =
          "Deposited ₱" + amount;
      } else {
        document.getElementById("output").innerText = "Please enter a valid amount.";
      }
      document.getElementById("amount").value = "";
    }

    function withdraw() {
      var amount = parseFloat(document.getElementById("amount").value);
      if (amount > 0 && amount <= balance) {
        balance -= amount;
        document.getElementById("output").innerText =
          "Withdraw ₱" + amount + ". Remaining Balance: ₱" + balance;
      } else {
        document.getElementById("output").innerText = "Invalid amount or insufficient balance.";
      }
      document.getElementById("amount").value = "";
    }

    function checkBalance() {
      document.getElementById("output").innerText = "Your current balance is ₱" + balance;
    }

    function clearSystem() {
      balance = 0;
      document.getElementById("output").innerText = "System cleared. Balance reset to ₱0.";
      document.getElementById("amount").value = "";
    }
  </script>

</body>
</html>
